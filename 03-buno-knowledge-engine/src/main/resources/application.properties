server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.jpa.hibernate.ddl-auto=update
aegis.base-url=${AEGIS_BASE_URL:http://host.docker.internal:8099}
aegis.api-key=${AEGIS_API_KEY:}
aegis.chat-path=${AEGIS_CHAT_PATH:/v1/chat/completions}
management.endpoints.web.exposure.include=health,info
