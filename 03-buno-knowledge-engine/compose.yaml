services:
 app:
  build: .
  ports: ["8103:8080"]
  environment:
   SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/knowledge
   SPRING_DATASOURCE_USERNAME: app
   SPRING_DATASOURCE_PASSWORD: app
   AEGIS_BASE_URL: ${AEGIS_BASE_URL:-http://host.docker.internal:8099}
   AEGIS_API_KEY: ${AEGIS_API_KEY:-}
   AEGIS_CHAT_PATH: ${AEGIS_CHAT_PATH:-/v1/chat/completions}
  depends_on:
   db: {condition: service_healthy}
 db:
  image: postgres:16-alpine
  environment: {POSTGRES_DB: knowledge, POSTGRES_USER: app, POSTGRES_PASSWORD: app}
  healthcheck: {test: ["CMD-SHELL","pg_isready -U app -d knowledge"], interval: 5s, timeout: 3s, retries: 20}
